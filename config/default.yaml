# PLANNING.md §8. Open and resolved decisions are tracked in docs/data.md.
data:
  dataset: GLBX.MDP3
  product: ES.FUT
  series: monthly_eom          # weekly | monthly_eom | quarterly (European exercise only)
  start: 2023-10-01            # shorten if license/cost requires
  end: 2026-09-30
  snapshot_time_ct: "15:00"    # last-quote cutoff before cash close
  budget_usd: 50               # abort pull if estimated cost exceeds this
pricing:
  rate_source: constant        # constant | fred
  rate_constant: 0.04
  day_count: ACT/365
cleaning:
  min_strikes: 10
  min_range_pct: 0.10
  drop_zero_bid: true
  drop_crossed: true
  drop_locked: true
  backfill_minutes: 15         # look-back for strikes not quoted at the snapshot minute
quality:                       # chain-level checks after cleaning (docs/stages/02_snapshots.md)
  action: flag                 # flag | reject (reject drops the failing chains before stage 4 builds them)
  min_calls: 8                 # two-sided calls per chain
  min_puts: 8                  # two-sided puts per chain
  min_strikes: 20
  min_range_pct: 0.15          # strikes must reach F(1 - x) and F(1 + x); stage 2 already enforces 0.10
  max_quote_age_s: 300         # a quote older than this at the snapshot is stale
  max_stale_share: 0.25        # flag a chain if more than this share of its quotes is stale
  max_futures_age_s: 300       # futures observation older than this at the snapshot
  max_sync_gap_s: 300          # median |option quote time - futures observation time|
strip:
  method: vix_discrete         # vix_discrete | iv_grid (Carr-Wu implementation)
  price_col: mid               # mid | bid | ask
  maturity_mode: matched       # matched | constant_30d
  min_front_days: 8            # use next two expiries if nearest is closer (Carr-Wu)
  max_iv: 1.0                  # drop strip inputs with implied vol above this (Bakshi-Kapadia: 100%)
  min_iv: 0.01                 # ... or below this (Bakshi-Kapadia: 1%)
  max_k0_gap_pct: 0.01         # no swap rate if K0 is more than 1% of F below F (no quotes near the money)
  max_cm_extrapolation_days: 60  # no 30-day swap rate if the nearest valid expiry is more than this far out
realized:
  frequency: [daily, 5m]
  session: full_globex         # full_globex | rth   (decided, §15.3)
  max_gap_days: 2              # leave RV empty if the bars miss either end of the window by more
hedging:
  hedge_delta: iv_daily        # iv_daily | iv_fixed | rv
  rebalance: daily
  moneyness_max: 0.10
  maturity_buckets_days: [14, 30, 60]
costs:
  option_halfspread: from_data # or fixed number of index points
  hedge_slippage_ticks: 0.5
  fee_per_contract_usd: 1.50
inference:
  hac_lags: auto               # horizon in trading days - 1; also report 30 (Carr-Wu)
  cluster_by: entry_date
regimes:
  variable: sw_level           # sw_level | trailing_rv_21d
  n_bins: 3
  window: expanding
