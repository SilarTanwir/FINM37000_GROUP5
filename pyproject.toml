[project]
name = "esvrp"
version = "0.1.0"
description = "Variance risk premium in E-mini S&P 500 futures options (Carr-Wu and Bakshi-Kapadia)"
requires-python = ">=3.11"
dependencies = [
  "databento",
  "pandas",
  "numpy",
  "scipy",
  "statsmodels",
  "pyarrow",
  "pyyaml",
  "python-dotenv",
  "matplotlib",
  "doit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
